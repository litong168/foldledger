org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.daemon=false
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# 工程目录含中文字符时，AGP 默认会拒绝构建。
# 现代 aapt2（build-tools 30+）在 Windows 上已能正确处理 UTF-8 路径，
# 因此这里显式关闭路径检查，保证工程可以放在中文目录下直接构建。
android.overridePathCheck=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

