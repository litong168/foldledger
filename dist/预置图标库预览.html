<title>滴水记账 · 预置分类图标库</title>
<style>
  :root{
    --bg:#F7F7FA; --card:#FFFFFF; --line:#E1E4EC;
    --ink:#14161A; --ink2:#5A6172; --brand:#1F6FEB;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F1116; --card:#171B22; --line:#2C323E; --ink:#E7E9EF; --ink2:#A8B0C0; --brand:#7CAEF5; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 环境柔光底：和 App 里 GlassBackground 同一套思路 */
  .glow{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
  .glow i{position:absolute; display:block; border-radius:50%; filter:blur(70px); opacity:.5}
  .glow i:nth-child(1){width:70vw;height:70vw;left:-18vw;top:-16vw;background:var(--brand)}
  .glow i:nth-child(2){width:58vw;height:58vw;right:-14vw;top:6vh;background:#FF9C1A}
  .glow i:nth-child(3){width:64vw;height:64vw;left:6vw;bottom:-22vw;background:#7048E8}
  @media (prefers-color-scheme: dark){ .glow i{opacity:.26} }

  header{padding:40px 26px 8px; max-width:1120px; margin:0 auto}
  h1{margin:0 0 8px; font-size:26px; letter-spacing:-.01em}
  .sub{color:var(--ink2); font-size:13px; line-height:1.7}
  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
  .pill{
    font-size:12px; padding:6px 12px; border-radius:999px;
    background:color-mix(in srgb, var(--brand) 13%, transparent);
    color:var(--brand); font-weight:600;
  }
  main{max-width:1120px; margin:0 auto; padding:16px 26px 60px}
  .groups{display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 18px}
  .gtab{
    font-size:12px; padding:7px 13px; border-radius:999px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); color:var(--ink);
    user-select:none;
  }
  .gtab.on{background:var(--brand); border-color:transparent; color:#fff; font-weight:600}
  section{
    background:color-mix(in srgb, var(--card) 82%, transparent);
    border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius:20px; padding:20px; margin-bottom:18px;
    backdrop-filter:blur(10px);
  }
  section > h2{
    margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:8px;
  }
  section > h2 small{font-weight:400; color:var(--ink2); font-size:11px}
  .grid{
    display:grid; gap:8px; margin-top:14px;
    grid-template-columns:repeat(auto-fill,minmax(58px,1fr));
  }
  .ic{
    height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--ink) 6%, transparent);
    font-size:24px; cursor:default; transition:transform .12s ease, background .12s ease;
    position:relative;
  }
  .ic:hover{transform:scale(1.08); background:color-mix(in srgb, var(--brand) 18%, transparent)}
  .ic span.k{
    position:absolute; bottom:3px; left:0; right:0; text-align:center;
    font-size:8px; color:var(--ink2); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    padding:0 3px; opacity:0; transition:opacity .12s ease;
  }
  .ic:hover span.k{opacity:1}
  .search{
    width:100%; max-width:420px; margin-top:20px; padding:11px 15px; font-size:14px;
    border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--brand)}
  .empty{color:var(--ink2); font-size:13px; padding:20px 0}
  footer{color:var(--ink2); font-size:11.5px; line-height:1.9; max-width:1120px; margin:0 auto; padding:0 26px 60px}
  code{background:color-mix(in srgb, var(--ink) 8%, transparent); padding:1px 5px; border-radius:5px; font-size:11px}
</style>
</head>

<div class="glow"><i></i><i></i><i></i></div>

<header>
  <h1>滴水记账 · 预置分类图标库</h1>
  <div class="sub">
    这是分类管理里「选择图标」弹层的全部预置内容，直接照着源码里的
    <code>CategoryIconLibrary.kt</code> 生成，所以永远和 App 里的一致。<br>
    每个图标都带中文关键词，弹层里输入「加油」「疫苗」「房贷」这类词就能直接搜到。
  </div>
  <div class="stats" id="stats"></div>
  <input class="search" id="q" placeholder="搜索图标（如：加油 / 疫苗 / 房贷 / 奶粉）">
</header>

<main>
  <div class="groups" id="tabs"></div>
  <div id="body"></div>
</main>

<footer id="foot"></footer>

const tabsEl = document.getElementById('tabs');
const bodyEl = document.getElementById('body');
const footEl = document.getElementById('foot');
const qEl = document.getElementById('q');

document.getElementById('stats').innerHTML = `
  <span class="pill">${GROUPS.length} 个分组</span>
  <span class="pill">${GROUPS.reduce((s,g)=>s+g.icons.length,0)} 个图标</span>
  <span class="pill">支持中文关键词搜索</span>
  <span class="pill">也支持上传自己的图片</span>
`;

let active = 0;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function iconTile(ic){
  return `<div class="ic" title="${esc(ic.k)}">${ic.e}<span class="k">${esc(ic.k.split(' ')[0])}</span></div>`;
}

function renderTabs(){
  tabsEl.innerHTML = GROUPS.map((g,i)=>
    `<div class="gtab ${i===active?'on':''}" data-i="${i}">${g.emoji} ${esc(g.name)}</div>`
  ).join('');
  tabsEl.querySelectorAll('.gtab').forEach(el=>{
    el.onclick = ()=>{ active = +el.dataset.i; render(); };
  });
}

function render(keyword){
  const q = (keyword||'').trim();
  if(q){
    const hits = [];
    GROUPS.forEach(g=>g.icons.forEach(ic=>{
      if(ic.k.includes(q) || ic.e === q) hits.push(ic);
    }));
    tabsEl.style.display = 'none';
    bodyEl.innerHTML = hits.length
      ? `<section><h2>🔍 搜索「${esc(q)}」 <small>命中 ${hits.length} 个</small></h2>
         <div class="grid">${hits.map(iconTile).join('')}</div></section>`
      : `<div class="empty">没找到匹配的图标。换个词试试，或者在 App 里点「从相册上传图片」。</div>`;
    return;
  }
  tabsEl.style.display = '';
  const g = GROUPS[active];
  bodyEl.innerHTML = `<section>
      <h2>${g.emoji} ${esc(g.name)} <small>${g.icons.length} 个</small></h2>
      <div class="grid">${g.icons.map(iconTile).join('')}</div>
    </section>`;
}

footEl.innerHTML = `
  说明：图标库是纯 Emoji，不引任何图标资源包 —— 零体积、全彩、任意尺寸都不糊，<br>
  在任何 Android 版本上表现一致。用户上传的图片会被居中裁成 256×256 的方形 PNG，<br>
  存在应用私有目录 <code>filesDir/category_icons/</code> 下（不需要存储权限）。<br>
  用户上传的图片不进备份包：恢复旧备份后如果图标文件不在，会优雅降级成 🖼️ 占位。
`;

qEl.oninput = () => render(qEl.value);
renderTabs();
render();
